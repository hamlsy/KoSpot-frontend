name: Mobile Android Build

on:
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GIT_PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Setup production environment
        run: node scripts/setup-env.js production setup

      - name: Build web assets
        run: npm run build:prod

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify android project
        run: |
          if [ ! -d "android" ]; then
            echo "android project directory not found."
            echo "Run 'npx cap add android' on a local dev machine first."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
