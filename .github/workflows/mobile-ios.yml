name: Mobile iOS Build

on:
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GIT_PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Setup production environment
        run: node scripts/setup-env.js production setup

      - name: Build web assets
        run: npm run build:prod

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Verify ios project
        run: |
          if [ ! -d "ios" ]; then
            echo "ios project directory not found."
            echo "Run 'npx cap add ios' on a macOS dev machine first."
            exit 1
          fi

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build

      - name: Upload iOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ~/Library/Logs/DiagnosticReports
